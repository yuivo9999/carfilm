<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>车载本地视频播放器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 背景图 */
    #background {
      position: fixed;
      inset: 0;
      background: url("bg.jpg") center center / cover no-repeat;
      z-index: 0;
    }

    /* 顶部常驻信息层（整体下移两个文字高度） */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      padding: 80px 20px 12px;
      text-align: center;
      color: #fff;
      pointer-events: none;
    }
    #clock {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      pointer-events: auto;
      color: #ffffff;
      -webkit-text-stroke: 2px rgba(0,0,0,0.1);
      font-variant-numeric: tabular-nums;
    }
    #subtitle {
      margin-top: 1px;
      font-size: 14px;
      font-weight: 400;
      pointer-events: auto;
      cursor: pointer;
      display: inline-block;
      outline: none;
      color: #bfc4c5;
      -webkit-text-stroke: 2px rgba(0,0,0,0.1);
      min-width: 80px;
      max-width: 80vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 中间平板电脑（内阴影边框） */
    #tablet {
      position: fixed;
      z-index: 10;
      top: 44%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(74vw, 840px);
      aspect-ratio: 16 / 10.2;
      background: #000;
      border-radius: 14px;
      padding: 11px;
      box-shadow:
        0 18px 50px rgba(0,0,0,0.65),
        inset 0 0 0 10px #1a1a1a,
        inset 0 0 0 11px #333;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 视频屏幕：固定黑色描边，缩放只作用于内部 video，边框不被平板遮住 */
    #screen {
      position: relative;
      width: 100%; height: 100%;
      border: 4px solid #000;
      border-radius: 4px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 视频右上角：播放时间 / 总时间（白字、无背景无样式，高度为平板高度的 1/12） */
    #video-time {
      position: absolute;
      top: 0; right: 0;
      z-index: 6;
      color: #fff;
      font-weight: 400;
      line-height: 1;
      padding: 3px 7px;
      pointer-events: none;
      text-shadow: none;
      background: none;
      border: none;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #video-time.hidden { display: none; }

    video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      cursor: pointer;
      transform-origin: center;
      transition: transform 0.1s linear;
    }
    video:not([src]) {
      opacity: 0;
    }

    /* 平板下方：横向粗激活区（点击任意处出现缩放条，无小图标） */
    #zoom-zone {
      position: fixed;
      z-index: 15;
      top: 73.5%; left: 0; right: 0;
      height: 60px;
      cursor: pointer;
    }

    /* 独立缩放面板 */
    #zoom-panel {
      position: fixed;
      z-index: 26;
      top: 71%; left: 50%;
      transform: translateX(-50%);
      width: min(70vw, 720px);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 13px;
      backdrop-filter: blur(6px);
      opacity: 1;
      transition: opacity 0.3s;
      user-select: none;
    }
    #zoom-panel.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #zoom-slider {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.22);
      border-radius: 3px;
      cursor: pointer;
      outline: none;
      accent-color: #fff;
    }
    #zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
      margin-top: -4.5px;
    }
    #zoom-slider::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; }
    #zoom-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none; }
    .zoom-text { min-width: 42px; text-align: center; }

    /* 底部左下角：平板升降控制触发区 */
    #position-zone {
      position: fixed;
      z-index: 15;
      left: 0; bottom: 0;
      width: 60px; height: 140px;
      cursor: pointer;
    }

    /* 平板升降面板（竖向滑条） */
    #position-panel {
      position: fixed;
      z-index: 26;
      left: 14px; bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 12px;
      backdrop-filter: blur(6px);
      opacity: 1;
      transition: opacity 0.3s;
      user-select: none;
    }
    #position-panel.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #position-slider {
      -webkit-appearance: slider-vertical;
      appearance: slider-vertical;
      width: 8px; height: 140px;
      cursor: pointer;
      accent-color: #fff;
    }
    #position-reset {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #position-reset:active { background: rgba(255,255,255,0.24); }

    /* 顶部两侧：控制「下方文字」「顶部时间」升降的触发区与面板 */
    .top-slider-zone {
      position: fixed;
      z-index: 15;
      top: 0;
      width: 70px; height: 200px;
      cursor: pointer;
    }
    #subtitle-zone { left: 0; }
    #clock-zone { right: 0; }

    .top-slider-panel {
      position: fixed;
      z-index: 26;
      top: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 12px;
      backdrop-filter: blur(6px);
      opacity: 1;
      transition: opacity 0.3s;
      user-select: none;
    }
    .top-slider-panel.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #subtitle-panel { left: 14px; }
    #clock-panel { right: 14px; }
    .top-slider-panel input[type="range"] {
      -webkit-appearance: slider-vertical;
      appearance: slider-vertical;
      width: 8px; height: 140px;
      cursor: pointer;
      accent-color: #fff;
    }
    .top-slider-reset {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .top-slider-reset:active { background: rgba(255,255,255,0.24); }

    /* 底部中间：呼出导航栏触发区 */
    #controls-zone {
      position: fixed;
      z-index: 15;
      left: 25%; bottom: 0;
      width: 50%; height: 260px;
      cursor: pointer;
    }

    /* 底部控制栏（默认隐藏，点击画面/底部中间才显示） */
    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 30;
      padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.78), transparent);
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: none;
    }
    #controls.hidden {
      opacity: 0;
      transform: translateY(30px);
      pointer-events: none;
    }

    /* 进度条 */
    #progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
    }
    #progress-bar {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.22);
      border-radius: 3px;
      cursor: pointer;
      outline: none;
      accent-color: #fff;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
      margin-top: -4.5px;
    }
    #progress-bar::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; }
    #progress-bar::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none; }
    .time-text { min-width: 42px; text-align: center; }

    /* 按钮行 */
    #buttons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button, .file-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
      min-width: max-content;
    }
    button:hover, .file-btn:hover { background: rgba(255,255,255,0.24); }
    button:active, .file-btn:active { transform: scale(0.96); }
    button svg, .file-btn svg { width: 18px; height: 18px; fill: currentColor; }

    #normalize-btn.active {
      background: rgba(76, 175, 80, 0.35);
      border-color: rgba(129, 199, 132, 0.6);
      color: #e8f5e9;
    }

    #volume {
      width: 90px;
      cursor: pointer;
      accent-color: #fff;
    }

    /* 倍速下拉、跳过片尾输入框 复用按钮外观 */
    select.speed-select, input.skip-input {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    input.skip-input {
      width: 16px;
      padding: 8px 3px;
      min-width: 0;
      text-align: center;
      cursor: text;
      -moz-appearance: textfield;
    }
    input.skip-input::-webkit-outer-spin-button,
    input.skip-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    select.speed-select option { color: #000; }
    .ctrl-label { font-size: 12px; color: rgba(255,255,255,0.85); white-space: nowrap; }

    /* 隐藏原生文件输入 */
    #file-input, #bg-input { display: none; }

    /* 背景库弹窗面板 */
    #bg-library {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(2px);
    }
    #bg-library.hidden { display: none; }
    .bg-library-box {
      width: min(92vw, 560px);
      max-height: 80vh;
      overflow-y: auto;
      background: #1c1c1c;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .bg-library-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-size: 16px;
      margin-bottom: 14px;
    }
    .bg-library-head button {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 30px; height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .bg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 12px;
    }
    .bg-tile {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 10px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      border: 2px solid transparent;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .bg-tile:hover { border-color: rgba(255,255,255,0.5); }
    .bg-tile.current { border-color: #4da3ff; }
    .bg-tile .bg-name {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      font-size: 11px;
      color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bg-tile-del {
      position: absolute;
      top: 4px; right: 4px;
      width: 20px; height: 20px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: block;
    }
    .bg-tile:hover { bbackground: rgba(220,38,38,0.9);}
    .bg-add-tile {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      margin-top: 12px;
      border-radius: 10px;
      border: 2px dashed rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      font-size: 13px;
    }
    .bg-add-tile:hover { border-color: rgba(255,255,255,0.6); color: #fff; }
    .bg-add-tile .plus { font-size: 18px; line-height: 1; }
    .bg-tile.selected { border-color: #2e7d32; }
    .bg-tile.selected::after {
      content: '✓';
      position: absolute;
      top: 4px; left: 4px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #2e7d32; color: #fff;
      font-size: 13px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .bg-tile.pending { border-style: dashed; border-color: rgba(255,255,255,0.45); }
    .bg-footer { display: flex; justify-content: flex-end; margin-top: 14px; }
    .bg-confirm-btn {
      background: #2e7d32; color: #fff; border: none;
      border-radius: 10px; padding: 10px 22px; font-size: 14px; cursor: pointer;
    }
    .bg-confirm-btn:disabled {
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); cursor: default;
    }
    

    /* 横屏观看模式：CSS 旋转整个界面（独立于全屏，安卓随时可用） */
    body.landscape {
      position: fixed;
      top: 0; left: 0;
      width: 100vh;
      height: 100vw;
      transform: translateX(100vw) rotate(90deg);
      transform-origin: top left;
      overflow: hidden;
    }

    /* 响应式 */
    @media (max-width: 640px) {
      #top-bar { padding-top: 64px; }
      #clock { font-size: 19.2px; }
      #subtitle { font-size: 12.8px; }
      #tablet { width: 92vw; top: 42%; }
      #zoom-zone { top: 72%; }
      #zoom-panel { top: 69%; width: 86vw; }
      #position-zone { width: 50px; height: 120px; }
      #position-panel { left: 10px; bottom: 100px; padding: 12px 8px; }
      #position-slider { height: 120px; }
      #controls-zone { height: 50px; }
      button, .file-btn { padding: 8px 11px; font-size: 13px; }
      #buttons-row { gap: 8px; }
      .group { gap: 6px; }
    }

    /* 横屏：时间与文字顶到顶部 */
    @media (orientation: landscape) {
      #top-bar { padding-top: 16px; }
    }
  </style>
</head>
<body>
  <div id="background"></div>

  <div id="top-bar">
    <div id="clock">00:00</div>
    <div id="subtitle" contenteditable="true" spellcheck="false">点击编辑文字</div>
  </div>

  <div id="tablet">
    <div id="screen">
      <video id="video" playsinline></video>
      <div id="video-time">0:00 / 0:00</div>
    </div>
  </div>

  <!-- 平板下方：横向粗激活区（点击任意处出现缩放条） -->
  <div id="zoom-zone" title="轻触此处调整画面缩放"></div>

  <!-- 独立缩放面板 -->
  <div id="zoom-panel" class="hidden">
    <span class="zoom-text">画面缩放</span>
    <input id="zoom-slider" type="range" min="0.5" max="2.0" value="1" step="0.05" />
    <span class="zoom-text" id="zoom-value">100%</span>
  </div>

  <!-- 底部左下角：平板升降控制触发区 -->
  <div id="position-zone" title="轻触此处调整平板位置"></div>

  <!-- 平板升降面板（竖向滑条） -->
  <div id="position-panel" class="hidden">
    <span>下</span>
    <input id="position-slider" type="range" min="-50" max="50" value="0" orient="vertical" />
    <span>上</span>
    <button id="position-reset">恢复默认</button>
  </div>

    <!-- 顶部左侧：控制「下方文字」升降 -->
    <div id="subtitle-zone" class="top-slider-zone" title="轻触此处调整下方文字位置"></div>
    <div id="subtitle-panel" class="top-slider-panel hidden">
      <span>上</span>
      <input id="subtitle-slider" type="range" min="-100" max="100" value="0" orient="vertical" />
      <span>下</span>
      <button id="subtitle-reset" class="top-slider-reset">隐藏</button>
    </div>

    <!-- 顶部右侧：控制「顶部时间」升降 -->
    <div id="clock-zone" class="top-slider-zone" title="轻触此处调整顶部时间位置"></div>
    <div id="clock-panel" class="top-slider-panel hidden">
      <span>上</span>
      <input id="clock-slider" type="range" min="-100" max="100" value="0" orient="vertical" />
      <span>下</span>
      <button id="clock-reset" class="top-slider-reset">隐藏</button>
    </div>

    <!-- 底部中间：呼出导航栏触发区 -->
    <div id="controls-zone" title="轻触此处呼出控制栏"></div>

  <!-- 底部控制栏 -->
  <div id="controls" class="hidden">
    <div id="progress-row">
      <span class="time-text" id="current">0:00</span>
      <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1" />
      <span class="time-text" id="duration">0:00</span>
    </div>
    <div id="buttons-row">
      <div class="group">
        <button id="play-btn" title="播放/暂停">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="stop-btn" title="停止">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button id="rewind30-btn" title="快退30秒">«30</button>
        <button id="forward30-btn" title="快进30秒">30»</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="1" title="音量" />
        <button id="normalize-btn" title="均衡不同视频音量">均衡:关</button>
      </div>
      <div class="group">
        <span class="ctrl-label">倍速</span>
        <select id="speed" class="speed-select" title="播放倍速">
          <option value="0.1">0.1x</option>
          <option value="0.5">0.5x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.5">1.5x</option>
          <option value="2.0">2.0x</option>
          <option value="3.0">3.0x</option>
          <option value="5.0">5.0x</option>
        </select>
        <span class="ctrl-label">跳过片尾</span>
        <input id="skip-end" class="skip-input" type="number" min="0" step="1" value="3" title="播放到片尾前几秒自动循环" />
        <span class="ctrl-label">秒</span>
        <button id="bg-library-btn" title="打开背景库，选择或管理背景壁纸">背景库</button>
        <button id="video-time-toggle" title="显示/隐藏视频右上角时间">时间:开</button>
      </div>
      <div class="group">
        <label class="file-btn" for="file-input" title="选择本地视频">
          <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
          选择本地视频
        </label>
        <input id="file-input" type="file" accept="video/*" />
        <input id="bg-input" type="file" accept="image/*" />
        <button id="fullscreen-toggle-btn" title="进入 / 退出全屏">全屏</button>
        <button id="orientation-toggle-btn" title="切换横屏 / 竖屏观看">竖屏</button>
      </div>
    </div>
  </div>

  <!-- 背景库弹窗面板 -->
  <div id="bg-library" class="hidden">
    <div class="bg-library-box">
      <div class="bg-library-head">
        <span>背景库</span>
        <button id="bg-library-close" title="关闭">✕</button>
      </div>
      <div class="bg-grid" id="bg-grid"></div>
      <label class="bg-add-tile" id="bg-add-tile" for="bg-input" title="从本地添加背景图片">
        <span class="plus">+</span>
        <span>添加背景</span>
      </label>
      <div class="bg-footer">
        <button id="bg-confirm-btn" class="bg-confirm-btn" disabled title="确认应用选中的背景">确认</button>
      </div>
    </div>
  </div>
  
  <script>
    const video = document.getElementById('video');
    const tablet = document.getElementById('tablet');
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');
    const fileInput = document.getElementById('file-input');
    const bgInput = document.getElementById('bg-input');
    const backgroundEl = document.getElementById('background');
    const bgLibBtn = document.getElementById('bg-library-btn');
    const bgLibrary = document.getElementById('bg-library');
    const bgGrid = document.getElementById('bg-grid');
    const bgLibClose = document.getElementById('bg-library-close');
    const bgConfirmBtn = document.getElementById('bg-confirm-btn');
    const bgAddTile = document.getElementById('bg-add-tile');
    const fullscreenToggleBtn = document.getElementById('fullscreen-toggle-btn');
    const orientationToggleBtn = document.getElementById('orientation-toggle-btn');
    const speedSelect = document.getElementById('speed');
    const skipEndInput = document.getElementById('skip-end');
    const rewind30Btn = document.getElementById('rewind30-btn');
    const forward30Btn = document.getElementById('forward30-btn');
    const videoTimeEl = document.getElementById('video-time');
    const videoTimeToggle = document.getElementById('video-time-toggle');
    const progressBar = document.getElementById('progress-bar');
    const currentEl = document.getElementById('current');
    const durationEl = document.getElementById('duration');
    const volumeEl = document.getElementById('volume');
    const controls = document.getElementById('controls');
    const clockEl = document.getElementById('clock');
    const subtitleEl = document.getElementById('subtitle');
    const zoomZone = document.getElementById('zoom-zone');
    const zoomPanel = document.getElementById('zoom-panel');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomValue = document.getElementById('zoom-value');
    const positionZone = document.getElementById('position-zone');
    const positionPanel = document.getElementById('position-panel');
    const positionSlider = document.getElementById('position-slider');
    const positionReset = document.getElementById('position-reset');
    const controlsZone = document.getElementById('controls-zone');
    const normalizeBtn = document.getElementById('normalize-btn');

    // 图标
    const iconPlay = '<path d="M8 5v14l11-7z"/>';
    const iconPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    // 时钟更新
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      clockEl.textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 字幕编辑：点击全选、回车保存、失焦保存
    subtitleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        subtitleEl.blur();
      }
    });
    subtitleEl.addEventListener('focus', () => {
      subtitleEl.classList.add('editing');
      setTimeout(() => {
        const range = document.createRange();
        range.selectNodeContents(subtitleEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }, 0);
    });
    subtitleEl.addEventListener('blur', () => {
      subtitleEl.classList.remove('editing');
      if (!subtitleEl.textContent.trim()) subtitleEl.textContent = '点击编辑文字';
      localStorage.setItem('car_video_subtitle', subtitleEl.textContent);
    });
    const saved = localStorage.getItem('car_video_subtitle');
    if (saved) subtitleEl.textContent = saved;

    // ----- 全屏 / 横竖 切换 -----
    let isLandscape = false;  // 当前是否为横屏观看模式

    // 启动时恢复上次横竖偏好
    if (localStorage.getItem('car_video_landscape') === '1') {
      isLandscape = true;
      document.body.classList.add('landscape');
    }

    function enterFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (!req || document.fullscreenElement) return;
      const p = req.call(el);
      if (p && p.then) p.then(updateFullscreenBtn).catch(() => {});
      else updateFullscreenBtn();
    }
    function exitFullscreen() {
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex && document.fullscreenElement) ex.call(document).catch(() => {});
    }
    function updateFullscreenBtn() {
      fullscreenToggleBtn.textContent = document.fullscreenElement ? '退出' : '全屏';
    }
    function updateOrientationBtn() {
      orientationToggleBtn.textContent = isLandscape ? '横屏' : '竖屏';
    }
    // 「全屏」按钮：进入 / 退出 全屏（方向跟随设备，与横竖旋转互不干扰）
    fullscreenToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (document.fullscreenElement) exitFullscreen();
      else enterFullscreen();
    });

    // 「横竖」按钮：CSS 旋转整个界面，随时切换横屏 / 竖屏 观看（不依赖全屏）
    orientationToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isLandscape = !isLandscape;
      document.body.classList.toggle('landscape', isLandscape);
      localStorage.setItem('car_video_landscape', isLandscape ? '1' : '0');
      updateOrientationBtn();
    });

    // 退出全屏（系统返回 / ESC）时同步按钮文字
    document.addEventListener('fullscreenchange', updateFullscreenBtn);

    updateFullscreenBtn();
    updateOrientationBtn();

    // ----- 底部导航栏：点击画面出现/隐藏，5秒无操作隐藏 -----
    let controlsHideTimer = null;
    function showControls() {
      controls.classList.remove('hidden');
      clearTimeout(controlsHideTimer);
      controlsHideTimer = setTimeout(() => {
        controls.classList.add('hidden');
      }, 5000);
    }
    video.addEventListener('click', (e) => {
      e.stopPropagation();
      if (controls.classList.contains('hidden')) {
        showControls();
      } else {
        clearTimeout(controlsHideTimer);
        controls.classList.add('hidden');
      }
    });
    controls.addEventListener('click', () => {
      if (!controls.classList.contains('hidden')) {
        clearTimeout(controlsHideTimer);
        controlsHideTimer = setTimeout(() => controls.classList.add('hidden'), 5000);
      }
    }, true);

    // ----- 缩放面板：点击平板下方横向区域才显示，3秒无操作隐藏 -----
    let zoomHideTimer = null;
    function showZoomPanel() {
      zoomPanel.classList.remove('hidden');
      clearTimeout(zoomHideTimer);
      zoomHideTimer = setTimeout(() => zoomPanel.classList.add('hidden'), 3000);
    }
    zoomZone.addEventListener('click', (e) => {
      e.stopPropagation();
      showZoomPanel();
    });
    zoomPanel.addEventListener('click', (e) => e.stopPropagation());
    function applyZoom(value) {
      video.style.transform = `scale(${value})`;
      zoomValue.textContent = Math.round(value * 100) + '%';
      localStorage.setItem('car_video_zoom', value);
    }
    zoomSlider.addEventListener('input', () => {
      applyZoom(parseFloat(zoomSlider.value));
      showZoomPanel();
    });
    const savedZoom = parseFloat(localStorage.getItem('car_video_zoom'));
    if (!isNaN(savedZoom) && savedZoom >= 0.5 && savedZoom <= 2.0) {
      zoomSlider.value = savedZoom;
      applyZoom(savedZoom);
    }

    // ----- 平板升降面板：点击左下角触发区显示，3秒无操作隐藏 -----
    const DEFAULT_TABLET_TOP = 44;
    let positionHideTimer = null;
    function showPositionPanel() {
      positionPanel.classList.remove('hidden');
      clearTimeout(positionHideTimer);
      positionHideTimer = setTimeout(() => positionPanel.classList.add('hidden'), 3000);
    }
    function applyTabletTop(offset) {
      let finalTop = DEFAULT_TABLET_TOP + offset;
      finalTop = Math.max(0, Math.min(100, finalTop));
      tablet.style.top = finalTop + '%';
      localStorage.setItem('car_video_tablet_top', finalTop);
    }
    positionZone.addEventListener('click', (e) => {
      e.stopPropagation();
      showPositionPanel();
    });
    positionPanel.addEventListener('click', (e) => e.stopPropagation());
    positionSlider.addEventListener('input', () => {
      applyTabletTop(parseFloat(positionSlider.value));
      showPositionPanel();
    });
    positionReset.addEventListener('click', (e) => {
      e.stopPropagation();
      positionSlider.value = 0;
      applyTabletTop(0);
      showPositionPanel();
    });
    const savedTop = parseFloat(localStorage.getItem('car_video_tablet_top'));
    if (!isNaN(savedTop)) {
      let offset = savedTop - DEFAULT_TABLET_TOP;
      offset = Math.max(-50, Math.min(50, offset));
      positionSlider.value = offset;
      applyTabletTop(offset);
    }

    // ----- 顶部两侧：竖向滑条控制「下方文字」「顶部时间」升降 -----
    function setupTopSlider(cfg) {
      let hideTimer = null;
      function showPanel() {
        cfg.panel.classList.remove('hidden');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => cfg.panel.classList.add('hidden'), 3000);
      }
      function applyOffset(offset) {
        // 滑条「上」(max) = 元素上移 => translateY 取负
        cfg.target.style.transform = `translateY(${-offset}px)`;
        localStorage.setItem(cfg.storageKey, offset);
      }
      // 显隐开关：控制该元素是否可见（按钮文字在「隐藏 / 显示」间切换）
      function applyVisibility() {
        if (cfg.hidden) {
          cfg.target.style.display = 'none';
          cfg.reset.textContent = '显示';
        } else {
          cfg.target.style.display = '';
          applyOffset(parseFloat(cfg.slider.value) || 0);
          cfg.reset.textContent = '隐藏';
        }
        localStorage.setItem(cfg.hiddenKey, cfg.hidden ? '1' : '0');
      }
      cfg.zone.addEventListener('click', (e) => { e.stopPropagation(); showPanel(); });
      cfg.panel.addEventListener('click', (e) => e.stopPropagation());
      cfg.slider.addEventListener('input', () => { applyOffset(parseFloat(cfg.slider.value)); showPanel(); });
      // 「显示 / 隐藏」开关
      cfg.reset.addEventListener('click', (e) => {
        e.stopPropagation();
        cfg.hidden = !cfg.hidden;
        applyVisibility();
        showPanel();
      });
      const saved = parseFloat(localStorage.getItem(cfg.storageKey));
      if (!isNaN(saved)) {
        const v = Math.max(-100, Math.min(100, saved));
        cfg.slider.value = v; applyOffset(v);
      }
      // 恢复上次的显隐偏好
      cfg.hidden = localStorage.getItem(cfg.hiddenKey) === '1';
      applyVisibility();
    }
    setupTopSlider({
      zone: document.getElementById('subtitle-zone'),
      panel: document.getElementById('subtitle-panel'),
      slider: document.getElementById('subtitle-slider'),
      reset: document.getElementById('subtitle-reset'),
      target: subtitleEl,
      storageKey: 'car_video_subtitle_top',
      hiddenKey: 'car_video_subtitle_hidden'
    });
    setupTopSlider({
      zone: document.getElementById('clock-zone'),
      panel: document.getElementById('clock-panel'),
      slider: document.getElementById('clock-slider'),
      reset: document.getElementById('clock-reset'),
      target: clockEl,
      storageKey: 'car_video_clock_top',
      hiddenKey: 'car_video_clock_hidden'
    });

    // 底部中间区域点击呼出导航栏
    controlsZone.addEventListener('click', (e) => {
      e.stopPropagation();
      if (controls.classList.contains('hidden')) showControls();
      else { clearTimeout(controlsHideTimer); controls.classList.add('hidden'); }
    });

    // 视频控制
    function togglePlay() {
      if (!video.src) return;
      if (video.paused) video.play();
      else video.pause();
    }
    function updatePlayIcon() {
      playBtn.innerHTML = video.paused ? `<svg viewBox="0 0 24 24">${iconPlay}</svg>` : `<svg viewBox="0 0 24 24">${iconPause}</svg>`;
    }
    playBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });

    stopBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (video.src) URL.revokeObjectURL(video.src);
      video.pause();
      video.removeAttribute('src');
      video.load();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      video.src = url;
      video.play().catch(() => {});
    });

    // ----- 背景库（localStorage，最多 6 张，缩略图预览 + 确认后才存全图） -----
    const BG_DEFAULT = 'default';
    const MAX_SLOTS = 6;
    let pendingBg = null;          // 待确认新图：{name, thumb, full}
    let selectedId = null;         // 当前选中（绿勾）的 id
    let selectedIsPending = false;

    function loadBgLib() {
      try {
        const raw = localStorage.getItem('car_video_backgrounds');
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }
    function saveBgLib(arr) {
      try { localStorage.setItem('car_video_backgrounds', JSON.stringify(arr)); return true; }
      catch (e) { return false; }   // 配额不足返回 false
    }
    function getCurrentBgId() {
      return localStorage.getItem('car_video_current_bg') || BG_DEFAULT;
    }
    function applyBgById(id) {
      const lib = loadBgLib();
      if (id === BG_DEFAULT) {
        backgroundEl.style.backgroundImage = '';   // 回退到 CSS 里的 bg.jpg
      } else {
        const item = lib.find(b => b.id === id);
        if (item) backgroundEl.style.backgroundImage = `url("${item.full}")`;
      }
      localStorage.setItem('car_video_current_bg', id);
    }
    // 压缩图片：限制最长边 maxDim，输出 JPEG
    function compressImage(file, maxDim, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    function buildTile(opts) {
      // opts: {id, name, displayUrl, isDefault, isPending}
      const tile = document.createElement('div');
      tile.className = 'bg-tile';
      if (opts.isPending) tile.classList.add('pending');
      if (!opts.isPending && getCurrentBgId() === opts.id) tile.classList.add('current');
      if (selectedId === opts.id) tile.classList.add('selected');
      tile.style.backgroundImage = opts.isDefault ? 'url("bg.jpg")' : `url("${opts.displayUrl}")`;
      tile.title = opts.name;
      const nameEl = document.createElement('div');
      nameEl.className = 'bg-name';
      nameEl.textContent = opts.name;
      tile.appendChild(nameEl);
      tile.addEventListener('click', () => {
        selectedId = opts.id;
        selectedIsPending = !!opts.isPending;
        bgConfirmBtn.disabled = false;
        renderBgLibrary();
      });
      if (!opts.isDefault && !opts.isPending) {
        const del = document.createElement('button');
        del.className = 'bg-tile-del';
        del.textContent = '✕';
        del.title = '删除该背景';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!confirm('确认删除这张背景图吗？')) return;
          const lib = loadBgLib().filter(b => b.id !== opts.id);
          saveBgLib(lib);
          if (getCurrentBgId() === opts.id) applyBgById(BG_DEFAULT);
          if (selectedId === opts.id) { selectedId = null; bgConfirmBtn.disabled = true; }
          renderBgLibrary();
        });
        tile.appendChild(del);
      }
      if (opts.isPending) {
        const del = document.createElement('button');
        del.className = 'bg-tile-del';
        del.textContent = '✕';
        del.title = '取消添加';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          pendingBg = null;
          if (selectedIsPending) { selectedId = null; bgConfirmBtn.disabled = true; }
          renderBgLibrary();
        });
        tile.appendChild(del);
      }
      return tile;
    }
    function renderBgLibrary() {
      const lib = loadBgLib();
      bgGrid.innerHTML = '';
      bgGrid.appendChild(buildTile({ id: BG_DEFAULT, name: '默认壁纸', displayUrl: null, isDefault: true }));
      lib.forEach(item => bgGrid.appendChild(buildTile({ id: item.id, name: item.name, displayUrl: item.thumb, isDefault: false })));
      if (pendingBg) bgGrid.appendChild(buildTile({ id: 'pending', name: pendingBg.name, displayUrl: pendingBg.thumb, isDefault: false, isPending: true }));
      // 名额已满时禁用"添加背景"
      const full = lib.length >= MAX_SLOTS;
      bgAddTile.style.opacity = full ? '0.4' : '1';
      bgAddTile.style.pointerEvents = full ? 'none' : 'auto';
    }
    function closeBgLibrary() { bgLibrary.classList.add('hidden'); }
    bgLibBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      renderBgLibrary();
      bgLibrary.classList.remove('hidden');
    });
    bgLibrary.addEventListener('click', (e) => { if (e.target === bgLibrary) closeBgLibrary(); });
    bgLibClose.addEventListener('click', (e) => { e.stopPropagation(); closeBgLibrary(); });

    // 选择 / 添加本地背景图片（先压缩成缩略图预览，确认后才存全图）
    bgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      e.target.value = '';
      Promise.all([ compressImage(file, 240, 0.6), compressImage(file, 1600, 0.8) ])
        .then(([thumb, full]) => {
          pendingBg = { name: file.name || '背景', thumb, full };
          selectedId = 'pending'; selectedIsPending = true;
          bgConfirmBtn.disabled = false;
          renderBgLibrary();
        })
        .catch(() => { alert('图片读取失败，请换一张再试。'); });
    });

    // 确认：应用选中项；若是待确认新图则先校验名额并存入
    bgConfirmBtn.addEventListener('click', () => {
      if (bgConfirmBtn.disabled) return;
      if (selectedId === BG_DEFAULT) {
        applyBgById(BG_DEFAULT);
      } else if (selectedIsPending && pendingBg) {
        const lib = loadBgLib();
        if (lib.length >= MAX_SLOTS) {
          alert('背景图最多 ' + MAX_SLOTS + ' 张，请先删除一些再添加。');
          return;
        }
        const id = 'bg_' + Date.now();
        if (!saveBgLib(lib.concat({ id, name: pendingBg.name, thumb: pendingBg.thumb, full: pendingBg.full }))) {
          alert('本地存储空间不足，请删除部分背景后重试。');
          return;
        }
        applyBgById(id);
        pendingBg = null;
      } else if (selectedId) {
        applyBgById(selectedId);
      }
      selectedId = null; selectedIsPending = false;
      bgConfirmBtn.disabled = true;
      renderBgLibrary();
    });

    // 启动时恢复上次选中的背景
    applyBgById(getCurrentBgId());

    volumeEl.addEventListener('input', () => { video.volume = volumeEl.value; });
    
    // ----- 音量均衡（响度压缩） -----
    let audioCtx = null;
    let mediaSource = null;
    let compressor = null;
    let normalizerEnabled = localStorage.getItem('car_video_normalize') === '1';

    function initAudioGraph() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();
      mediaSource = audioCtx.createMediaElementSource(video);
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -24;
      compressor.knee.value = 30;
      compressor.ratio.value = 12;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.25;
      mediaSource.connect(audioCtx.destination);
    }
    function setNormalizer(enabled) {
      normalizerEnabled = enabled;
      if (!audioCtx) initAudioGraph();
      if (!audioCtx || !mediaSource || !compressor) return;
      try { mediaSource.disconnect(); compressor.disconnect(); } catch (e) {}
      if (enabled) {
        mediaSource.connect(compressor);
        compressor.connect(audioCtx.destination);
      } else {
        mediaSource.connect(audioCtx.destination);
      }
    }
    function updateNormalizeBtn() {
      normalizeBtn.textContent = normalizerEnabled ? '均衡:开' : '均衡:关';
      normalizeBtn.classList.toggle('active', normalizerEnabled);
    }
    normalizeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      normalizerEnabled = !normalizerEnabled;
      localStorage.setItem('car_video_normalize', normalizerEnabled ? '1' : '0');
      updateNormalizeBtn();
      if (video.src) setNormalizer(normalizerEnabled);
    });
    video.addEventListener('play', () => {
      if (!audioCtx) initAudioGraph();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (normalizerEnabled && video.src) setNormalizer(true);
    });
    updateNormalizeBtn();

    // ----- 倍速播放 -----
    function applySpeed() {
      video.playbackRate = parseFloat(speedSelect.value) || 1;
    }
    speedSelect.addEventListener('change', applySpeed);
    applySpeed();

    // ----- 跳过片尾（默认3秒） -----
    let skipEnd = parseFloat(skipEndInput.value);
    if (isNaN(skipEnd) || skipEnd < 0) skipEnd = 3;
    const savedSkip = localStorage.getItem('car_video_skipend');
    if (savedSkip !== null) {
      const v = parseFloat(savedSkip);
      if (!isNaN(v) && v >= 0) { skipEnd = v; skipEndInput.value = v; }
    }
    skipEndInput.addEventListener('change', () => {
      let v = parseFloat(skipEndInput.value);
      if (isNaN(v) || v < 0) v = 0;
      skipEnd = v;
      localStorage.setItem('car_video_skipend', v);
    });

    // ----- 视频右上角时间显示（可开关） -----
    function applyVideoTimeFont() {
      const h = tablet.clientHeight;
      if (h) videoTimeEl.style.fontSize = (h / 24) + 'px';
    }
    function updateVideoTime() {
      videoTimeEl.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
    }
    function setVideoTimeOn(on) {
      videoTimeToggle.textContent = on ? '时间:开' : '时间:关';
      videoTimeEl.classList.toggle('hidden', !on);
      localStorage.setItem('car_video_time_on', on ? '1' : '0');
    }
    const savedTimeOn = localStorage.getItem('car_video_time_on');
    setVideoTimeOn(savedTimeOn === null ? true : savedTimeOn === '1');
    videoTimeToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      setVideoTimeOn(videoTimeEl.classList.contains('hidden'));
    });
    applyVideoTimeFont();
    window.addEventListener('resize', applyVideoTimeFont);

    // ----- 快退30秒 / 快进30秒 -----
    rewind30Btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!video.src) return;
      video.currentTime = Math.max(0, video.currentTime - 30);
    });
    forward30Btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!video.src) return;
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 30);
    });

    // 进度更新
    function formatTime(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${String(sec).padStart(2, '0')}`;
    }
    video.addEventListener('loadedmetadata', () => {
      progressBar.max = video.duration || 100;
      durationEl.textContent = formatTime(video.duration);
      updateVideoTime();
    });
    video.addEventListener('timeupdate', () => {
      progressBar.value = video.currentTime;
      currentEl.textContent = formatTime(video.currentTime);
      updateVideoTime();
      // 跳过片尾：播放到片尾前 N 秒自动循环播放（无任何提示）
      if (skipEnd > 0 && video.duration && isFinite(video.duration) &&
          video.currentTime >= video.duration - skipEnd - 0.25) {
        video.currentTime = 0;
        if (!video.paused) video.play().catch(() => {});
      }
    });
    video.addEventListener('play', updatePlayIcon);
    video.addEventListener('pause', updatePlayIcon);
    video.addEventListener('ended', updatePlayIcon);

    let isDragging = false;
    progressBar.addEventListener('input', () => {
      isDragging = true;
      video.currentTime = progressBar.value;
      currentEl.textContent = formatTime(video.currentTime);
    });
    progressBar.addEventListener('change', () => { isDragging = false; });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.target.isContentEditable) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        video.currentTime = Math.max(0, video.currentTime - 5);
      } else if (e.code === 'KeyF') {
        fullscreenToggleBtn.click();
      }
    });

    updatePlayIcon();
  </script>
</body>
</html>
